name: Bug report
description: Report a problem with MeshTour
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: What happened?
      description: Include the expected behavior, steps, and a small reproduction if you have one.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Versions and environment
      description: Include MeshTour, Three.js, browser, OS, and GPU if relevant.
  - type: textarea
    id: media
    attributes:
      label: Screenshots, video, or logs
      description: For a transition bug, include the two viewpoints. Remove any private tour data.
