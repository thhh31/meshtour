name: Feature request
description: Propose a focused addition to MeshTour
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What author or viewer problem would this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the smallest public API or behavior change that would solve it.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: scope
    attributes:
      label: Area
      options:
        - Core engine
        - React bindings
        - Config schema
        - Author mode
        - Asset pipeline
        - Demo or documentation
    validations:
      required: true
  - type: checkboxes
    id: contract
    attributes:
      label: Config compatibility
      options:
        - label: I understand config schema v1 is append-only.
          required: true
