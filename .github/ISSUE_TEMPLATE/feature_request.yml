name: Feature request
description: Suggest a change to MeshTour
labels: [enhancement]
body:
  - type: textarea
    id: use_case
    attributes:
      label: What are you trying to do?
      description: Describe where the current viewer or API gets in the way.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested change
